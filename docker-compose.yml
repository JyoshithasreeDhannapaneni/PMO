version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# PMO Tracker — Production Docker Compose
#
# Before running:
#   1. Copy .env.example to .env
#   2. Set SERVER_IP to your server's public IP or domain
#   3. Change DB_PASSWORD and JWT_SECRET to strong values
#   4. Run:  docker compose up -d --build
#
# The app will be available at http://SERVER_IP (port 80)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: pmo-postgres
    environment:
      POSTGRES_USER:     ${DB_USER:-pmo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pmo_password}
      POSTGRES_DB:       ${DB_NAME:-pmo_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pmo_user} -d ${DB_NAME:-pmo_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmo-backend
    environment:
      # Database — points to the postgres service on the internal Docker network
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-pmo_user}
      DB_PASSWORD: ${DB_PASSWORD:-pmo_password}
      DB_NAME:     ${DB_NAME:-pmo_tracker}
      # App
      PORT:            3001
      NODE_ENV:        production
      FRONTEND_URL:    http://${SERVER_IP:-localhost}
      ENABLE_CRON_JOBS: ${ENABLE_CRON_JOBS:-true}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pmo-tracker.com}
      # Microsoft SSO (optional)
      MICROSOFT_CLIENT_ID:     ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID:     ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI:  http://${SERVER_IP:-localhost}/api/auth/microsoft/callback
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pmo-network
    restart: unless-stopped

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time — must be the public URL
        NEXT_PUBLIC_API_URL: http://${SERVER_IP:-localhost}
    container_name: pmo-frontend
    environment:
      # Used by Next.js server-side rewrites to reach backend on internal network
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    networks:
      - pmo-network
    restart: unless-stopped

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pmo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pmo-network
    restart: unless-stopped

networks:
  pmo-network:
    driver: bridge

volumes:
  postgres_data:
