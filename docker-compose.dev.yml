# Local development override — starts only the database, exposed on localhost:5432
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Credentials match backend/.env (postgres / postgres123 / pmo_tracker)

services:
  postgres:
    image: postgres:15-alpine
    container_name: pmo-postgres-dev
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB:       pmo_tracker
    ports:
      - "5432:5432"
    volumes:
      - pmo_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pmo_dev_data:
